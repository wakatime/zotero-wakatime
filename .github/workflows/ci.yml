name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Lint
        run: npm run lint:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Run Build
        run: npm run build
      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: build-result
          path: .scaffold/build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Install wakatime-cli
        run: |
          mkdir -p "$HOME/.wakatime"
          curl -fsSL -o /tmp/wakatime-cli.zip \
            https://github.com/wakatime/wakatime-cli/releases/latest/download/wakatime-cli-linux-amd64.zip
          unzip -o /tmp/wakatime-cli.zip -d "$HOME/.wakatime"
          chmod +x "$HOME/.wakatime/wakatime-cli-linux-amd64"
      - name: Seed WakaTime config
        run: |
          # With wakatime-cli installed the plugin asks for an API key on
          # startup when ~/.wakatime.cfg has none. In a headless runner that
          # modal dialog blocks the main thread forever, so pre-seed a dummy
          # key (the tests never send heartbeats to the WakaTime API).
          printf '[settings]\napi_key=00000000-0000-0000-0000-000000000000\n' > "$HOME/.wakatime.cfg"
      - name: Run Tests
        run: npm run test
